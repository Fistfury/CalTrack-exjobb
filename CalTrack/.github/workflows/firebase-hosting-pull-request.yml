name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    name: Build and Preview for Pull Requests
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install and build the frontend
      - name: Install and build frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      # Step 3: Deploy to Firebase Hosting Preview Channel
      - name: Deploy to Firebase Hosting Preview Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CALTRACK_9B7B6 }}
          projectId: caltrack-9b7b6
          channelId: preview-${{ github.run_id }}
