name: Build and Deploy to Firebase

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    name: Build and Deploy Frontend and Backend
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Node.js for frontend (Node.js 20)
      - name: Set up Node.js for frontend
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install and build frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      # Step 3: Deploy to Firebase Hosting
      - name: Deploy to Firebase Hosting
        working-directory: ./frontend
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --token ${{ secrets.FIREBASE_DEPLOY_TOKEN }}

      # Step 4: Set up Node.js for backend (Node.js 18)
      - name: Set up Node.js for backend
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install and deploy Firebase Functions
        working-directory: ./functions
        run: |
          npm install
          firebase deploy --only hosting --token ${{ secrets.FIREBASE_DEPLOY_TOKEN }}
