name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_deploy:
    name: Build and Deploy Frontend and Backend
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Install and build frontend (Node.js 20)
      - name: Set up Node.js for frontend
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install and build frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      # Step 3: Deploy frontend to Firebase Hosting
      - name: Deploy to Firebase Hosting
        working-directory: ./frontend
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --token ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CALTRACK_9B7B6 }}

      # Step 4: Install and deploy backend Firebase Functions (Node.js 18)
      - name: Set up Node.js for backend
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install and deploy Firebase Functions
        working-directory: ./functions
        run: |
          npm install
          firebase deploy --only functions --token ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CALTRACK_9B7B6 }}

  build_and_preview:
    name: Build and Preview for Pull Requests
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Install and build the frontend
      - name: Install and build frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      # Step 3: Preview with Firebase Hosting Emulator
      - name: Deploy to Firebase Hosting Preview Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CALTRACK_9B7B6 }}
          projectId: caltrack-9b7b6
          channelId: preview-${{ github.run_id }}
